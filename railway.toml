# Railway — backend API (frontend stays on Vercel)
#
# Docker build context = repo root; Dockerfile copies backend/ explicitly.
# Do NOT set Root Directory = backend (would break COPY paths).
#
# Required env vars: APP_ENV, API_KEY, DATABASE_URL, CORS_ORIGINS, ENABLE_SCHEDULER

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
# /live is process liveness only. /health is readiness (503 if Postgres is down)
# and must not be the Railway healthcheck — a 503 unregisters the public domain
# ("Application not found" on *.up.railway.app and the Vercel proxy).
healthcheckPath = "/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
